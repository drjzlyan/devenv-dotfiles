# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Shell
set -g default-shell "$SHELL"
set -g default-command "$SHELL"

# Options
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
setw -g aggressive-resize on

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vi mode
setw -g mode-keys vi

# Pane navigation (vi-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window splitting keeps current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Pane titles (shown in status line)
setw -g pane-border-status top
setw -g pane-border-format " #{pane_index} #{pane_title} "

# Lazygit in a new window (prefix g)
bind g new-window -n git -c "#{pane_current_path}" "lazygit" \; display "Opened lazygit"

# Quick session switching (prefix s shows session list)
bind s choose-session

# Synchronize panes toggle (prefix S)
bind S setw synchronize-panes \; display "Synchronize panes: #{?pane_synchronized,ON,OFF}"

# Status line (minimal)
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=default"
set -g status-left " [#S] "
set -g status-right " %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "
